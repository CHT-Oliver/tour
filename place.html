<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Place</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="page place-page" data-page="place">
  <header class="site-header">
    <div class="brand">Haotian’s Atlas</div>
    <nav class="nav">
      <a href="./index.html#map">Map</a>
      <a href="./index.html#gallery">Gallery</a>
      <a href="./index.html#about">About</a>
    </nav>
  </header>

  <main>
    <section class="place-hero">
      <h1 id="place-title">Paris</h1>
      <div class="sub" id="place-meta"></div>
      <div class="tag-list" id="place-tags"></div>
      <div class="quote" id="place-quote"></div>
    </section>

    <section class="content-section" id="gallery">
      <div class="divider"></div>
      <div class="gallery-masonry" id="place-gallery"></div>
    </section>

    <section class="content-section">
      <div class="divider"></div>
      <div class="thoughts" id="place-thoughts"></div>
      <div class="divider"></div>
      <a class="back-button" href="./index.html" id="back-to-map">Return to Map</a>
    </section>
  </main>

  <footer class="site-footer">
    <span>© 2026 Haotian</span>
    <div class="social">
      <a href="#">Weibo</a>
      <a href="#">Instagram</a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.39/bundled/lenis.min.js"></script>
  <script type="module" src="./router/transition.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
